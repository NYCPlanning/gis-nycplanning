name: Lint

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: "3.11"
          channels: conda-forge

      - name: Install dev tooling via conda
        shell: bash -el {0}
        run: conda install --file deployment/conda-requirements-dev.txt -c conda-forge --yes

      - name: Run ruff
        shell: bash -el {0}
        run: ruff check .

      - name: Run mypy
        shell: bash -el {0}
        run: mypy src

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          Invoke-ScriptAnalyzer -Path . -Recurse
