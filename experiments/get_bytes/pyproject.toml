[project]
name = "get-bytes"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = [
    "requests",
    "beautifulsoup4",
    "pyogrio>=0.13.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16.7",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[tool.pytest.ini_options]
addopts = "--strict-markers"
pythonpath = ["."]

[tool.coverage.run]
branch = true
omit = ["tests/*"]
