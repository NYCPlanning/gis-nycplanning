[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "dcpgis"
version = "0.0.1"

[tool.setuptools.packages.find]
where = ["src"]
include = ["dcpgis*"]

[tool.mypy]
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = "arcpy"
ignore_missing_imports = true